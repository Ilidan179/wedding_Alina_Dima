<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Алина & Дмитрий — Приглашение на свадьбу</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&family=Mr+De+Haviland&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #fefaf7;
            color: #3e2c23;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        :root {
            --mountain-bg-hero: url('https://ilidan179.github.io/wedding/images/а первый заголовок.jpg');
            --mountain-bg-invite: url('https://ilidan179.github.io/wedding/images/б второй заголовок.webp');
        }

        /* ============================================================ */
        /* КОНВЕРТ НА ВЕСЬ ЭКРАН (ВАША КАРТИНКА)                        */
        /* ============================================================ */
        #envelope-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            /* 👇 ЗАМЕНИТЕ ССЫЛКУ НА ВАШУ КАРТИНКУ КОНВЕРТА 👇 */
            background: #8e1b12 url('https://ilidan179.github.io/wedding_Alina_Dima/images/envelope.jpg') center/cover no-repeat;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            overflow: hidden;
        }

        /* Эффект "раскрытия": экран плавно растворяется */
        #envelope-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Печать с сердечком (по центру) */
        .seal {
            position: relative;
            z-index: 3;
            width: min(26vw, 160px);
            height: min(26vw, 160px);
            background: #fdfcf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 -4px 10px rgba(0,0,0,0.1);
            font-size: min(13vw, 80px);
            color: #b52d22;
            animation: sealPulse 2.2s ease-in-out infinite;
            transition: transform 0.4s ease;
        }

        #envelope-screen:active .seal {
            transform: scale(0.92);
        }

        @keyframes sealPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* Текст "Нажмите, чтобы открыть" */
        .open-hint {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: hintBlink 2.5s ease-in-out infinite;
            z-index: 3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        @keyframes hintBlink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============================================================ */
        /* ОСНОВНОЙ КОНТЕНТ                                             */
        /* ============================================================ */
        #main-content {
            opacity: 0;
            transition: opacity 1s ease 0.6s;
        }
        #main-content.revealed { opacity: 1; }

        /* ========== СЕКЦИЯ ЗНАКОМСТВА ========== */
        .reveal-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #fefaf7 0%, #fbf0e8 100%);
            gap: 60px;
        }
        .groom-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .question {
            font-family: 'Great Vibes', 'Playfair Display', cursive;
            font-size: clamp(26px, 5vw, 46px);
            color: #b17a5c;
            line-height: 1.2;
            max-width: 600px;
        }
        .groom-photo {
            width: min(70vw, 340px);
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 25px 45px -15px rgba(90, 60, 40, 0.35);
            border: 6px solid #fff;
        }

        /* Блок невесты */
        .bride-block {
            position: relative;
            width: min(70vw, 340px);
            aspect-ratio: 3 / 4;
            cursor: pointer;
            perspective: 1200px;
        }
        .bride-cover {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #d64535 0%, #a8231a 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #fff;
            font-family: 'Great Vibes', 'Playfair Display', cursive;
            font-size: clamp(22px, 4.5vw, 34px);
            box-shadow: 0 25px 45px -15px rgba(140, 30, 20, 0.5);
            border: 6px solid #fff;
            transition: transform 0.9s cubic-bezier(0.4, 0.1, 0.2, 1), opacity 0.9s ease;
            transform-origin: left center;
            z-index: 3;
        }
        .bride-block.revealed .bride-cover {
            transform: rotateY(-105deg);
            opacity: 0;
            pointer-events: none;
        }
        .bride-photo {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 25px 45px -15px rgba(90, 60, 40, 0.35);
            border: 6px solid #fff;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
        }
        .bride-block.revealed .bride-photo { opacity: 1; transform: scale(1); }
        .bride-caption {
            position: absolute;
            bottom: -48px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Great Vibes', 'Playfair Display', cursive;
            font-size: clamp(26px, 5vw, 42px);
            color: #b17a5c;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.7s ease 0.9s, transform 0.7s ease 0.9s;
        }
        .bride-block.revealed .bride-caption { opacity: 1; transform: translateY(0); }

        .scroll-down {
            margin-top: 40px;
            color: #b17a5c;
            font-size: 28px;
            animation: bounceDown 2s ease-in-out infinite;
        }
        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* ========== HERO ========== */
        .hero {
            height: 100vh;
            min-height: 620px;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)),
                        var(--mountain-bg-hero) center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
            padding: 20px;
        }
        .hero-content {
            position: relative;
            color: white;
            max-width: 900px;
            padding: 20px;
            backdrop-filter: blur(2px);
            animation: gentleAppear 1.2s ease-out;
        }
        .hero h1 {
            font-family: 'Great Vibes', 'Mr De Haviland', 'Playfair Display', cursive;
            font-weight: 400;
            font-style: italic;
            color: white;
            text-shadow: 0 4px 18px rgba(0,0,0,0.25);
            font-size: clamp(42px, 15vw, 110px);
            white-space: nowrap;
            letter-spacing: 0.05em;
            padding: 0 12px;
        }
        @media (max-width: 450px) {
            .hero h1 { white-space: normal; line-height: 1.2; font-size: clamp(38px, 13vw, 60px); }
        }
        .date {
            margin-top: 20px;
            font-size: clamp(18px, 2.2vw, 26px);
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,255,255,0.3);
            display: inline-block;
            padding-top: 12px;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0;
            width: 100%; height: 120px;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* ========== ОБЩИЕ СЕКЦИИ ========== */
        .section { padding: 80px 24px; text-align: center; max-width: 1300px; margin: 0 auto; }
        .section h2 {
            font-family: 'Great Vibes', 'Mr De Haviland', 'Playfair Display', cursive;
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 20px;
            color: #b17a5c;
            font-weight: 500;
        }
        .section p { font-size: 18px; color: #5e4b3d; max-width: 600px; margin: 0 auto 20px; line-height: 1.5; }

        /* ========== ТАЙМЕР ========== */
        .timer-digits {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            row-gap: 2rem;
            margin: 30px auto 0;
            max-width: 860px;
        }
        .time-block {
            background: #fffcf9;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            min-width: 110px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(90, 70, 60, 0.08);
            transition: transform 0.2s ease;
        }
        .time-block:hover { transform: translateY(-5px); }
        .time-number {
            font-family: 'Montserrat', monospace;
            font-weight: 700;
            font-size: clamp(44px, 9vw, 78px);
            line-height: 1.1;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #b17a5c, #d9aa87);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .time-label {
            font-size: clamp(14px, 2vw, 18px);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            color: #7f6250;
            margin-top: 8px;
            border-top: 1px solid #f0e2d6;
            display: inline-block;
            padding-top: 6px;
        }
        .number-update { animation: pulse 0.35s ease-in-out; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ========== ФОРМА ========== */
        .form-container {
            max-width: 500px;
            margin: 40px auto 0;
            background: white;
            padding: 32px 28px;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.08);
            border: 1px solid rgba(179, 139, 109, 0.2);
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            margin-top: 8px;
            margin-bottom: 22px;
            border: 1px solid #e2cfc0;
            border-radius: 28px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            background: #fefcf9;
            transition: 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #b38b6d;
            box-shadow: 0 0 0 3px rgba(179, 139, 109, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #b38b6d;
            color: white;
            font-size: 18px;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }
        button:hover {
            background: #9c7459;
            transform: scale(0.98);
            box-shadow: 0 8px 18px rgba(156, 116, 89, 0.3);
        }

        @keyframes gentleAppear {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .fade-up {
            opacity: 0;
            transform: translateY(45px);
            transition: opacity 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.9s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        /* ========== ИНВАЙТ НА ГОРАХ ========== */
        .invite-mountains-full {
            position: relative;
            width: 100%;
            min-height: 500px;
            background: var(--mountain-bg-invite) center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 24px;
            overflow: hidden;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.1), inset 0 -8px 20px rgba(0,0,0,0.1);
        }
        .invite-mountains-full .invite-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(1px);
        }
        .invite-mountains-full .invite-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            color: white;
        }
        .invite-mountains-full h2 {
            font-family: 'Great Vibes', 'Mr De Haviland', 'Playfair Display', cursive;
            font-size: clamp(32px, 6vw, 52px);
            margin-bottom: 24px;
            color: white;
            text-shadow: 0 2px 15px rgba(0,0,0,0.4);
        }
        .invite-mountains-full p {
            font-size: clamp(16px, 3vw, 20px);
            line-height: 1.6;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 1px 8px rgba(0,0,0,0.3);
        }
        .invite-mountains-full::before {
            content: '';
            position: absolute;
            top: -1px; left: 0;
            width: 100%; height: 120px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            pointer-events: none;
            z-index: 2;
        }

        /* ========== ФОТО ПАРЫ ========== */
        .rounded-photo { padding: 40px 20px; display: flex; justify-content: center; align-items: center; }
        .photo-wrapper {
            width: 600px;
            height: 550px;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            background: #f0e8e0;
            position: relative;
        }
        .wedding-photo {
            width: 100%; height: 100%;
            display: block;
            object-fit: cover;
            object-position: 50% 40%;
            mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
        }
        @media (max-width: 640px) {
            .photo-wrapper { width: calc(100vw - 40px); height: auto; aspect-ratio: 600 / 550; }
        }
        .podpis { text-align: center; margin-top: 12px; padding: 0; }
        .photo-caption-light {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #b17a5c;
            font-style: italic;
        }
        @media (max-width: 680px) { .photo-caption-light { font-size: 18px; } }
        @media (max-width: 480px) { .photo-caption-light { font-size: 16px; } }

        /* ========== РАСПИСАНИЕ ========== */
        .schedule {
            background: linear-gradient(135deg, #fffaf5, #fef5ed);
            border-radius: 64px;
            margin: 40px auto;
            padding: 50px 30px;
            max-width: 800px;
            box-shadow: 0 20px 35px -12px rgba(90, 60, 40, 0.12);
            border: 1px solid rgba(179, 139, 109, 0.2);
        }
        .schedule-container { max-width: 600px; margin: 0 auto; }
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: white;
            border-radius: 48px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .schedule-item:hover { transform: translateX(8px); box-shadow: 0 10px 25px -8px rgba(0,0,0,0.1); }
        .schedule-time {
            font-family: 'Playfair Display', serif;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 700;
            color: #b17a5c;
            min-width: 90px;
            text-align: center;
            letter-spacing: 1px;
        }
        .schedule-divider {
            width: 2px; height: 50px;
            background: linear-gradient(to bottom, #d4c0b0, #b38b6d, #d4c0b0);
            border-radius: 2px;
        }
        .schedule-event { flex: 1; text-align: left; }
        .schedule-event h3 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 600;
            color: #3e2c23;
            margin-bottom: 6px;
        }
        .schedule-event p { font-family: 'Montserrat', sans-serif; font-size: 13px; color: #a4836a; margin: 0; line-height: 1.4; }
        @media (max-width: 550px) {
            .schedule { padding: 35px 20px; border-radius: 40px; margin: 30px 16px; }
            .schedule-item { gap: 12px; padding: 12px 16px; margin-bottom: 20px; }
            .schedule-time { min-width: 70px; font-size: 18px; }
            .schedule-divider { height: 40px; }
            .schedule-event h3 { font-size: 15px; }
            .schedule-event p { font-size: 11px; }
        }

        /* ========== КАРТА ========== */
        .map-section { padding: 60px 24px; background: linear-gradient(135deg, #fffaf5, #fef5ed); text-align: center; }
        .map-container {
            max-width: 900px;
            margin: 0 auto 20px;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            border: 1px solid rgba(179, 139, 109, 0.2);
        }
        #map { width: 100%; height: 400px; }
        .map-address {
            margin-top: 20px;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .map-address p { margin: 5px 0; font-size: 16px; color: #5e4b3d; text-align: center; }
        .map-address p:first-of-type { font-weight: 600; color: #b17a5c; }
        .map-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 28px;
            background: #b38b6d;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .map-button:hover { background: #9c7459; transform: scale(0.98); box-shadow: 0 8px 18px rgba(156, 116, 89, 0.3); }
        @media (max-width: 680px) {
            .map-section { padding: 40px 20px; }
            .map-container { border-radius: 32px; }
            #map { height: 300px; }
            .map-address p { font-size: 14px; }
        }

        /* ========== ДВЕ КОЛОНКИ ========== */
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .info-card {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 48px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(90, 60, 40, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(179, 139, 109, 0.2);
        }
        .info-card:hover { transform: translateY(-8px); box-shadow: 0 25px 40px -12px rgba(90, 60, 40, 0.2); }
        .info-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(24px, 4vw, 32px);
            color: #b17a5c;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .info-divider {
            width: 60px; height: 2px;
            background: linear-gradient(to right, #d4c0b0, #b38b6d, #d4c0b0);
            margin: 0 auto 20px;
            border-radius: 2px;
        }
        .info-card p { font-family: 'Montserrat', sans-serif; font-size: 15px; line-height: 1.6; color: #5e4b3d; margin: 0; }
        .accent-text { color: #b17a5c; font-weight: 500; }
        @media (max-width: 768px) {
            .two-columns { flex-direction: column; align-items: center; padding: 30px 20px; gap: 25px; }
            .info-card { max-width: 450px; width: 100%; padding: 32px 24px; }
            .info-card p { font-size: 14px; }
        }

        /* ========== ВЕДУЩИЙ ========== */
        .host-card {
            background: white;
            border-radius: 48px;
            padding: 35px 30px;
            max-width: 550px;
            margin: 30px auto;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(90, 60, 40, 0.12);
            border: 1px solid rgba(179, 139, 109, 0.2);
        }
        .host-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #b17a5c;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .host-divider {
            width: 60px; height: 2px;
            background: linear-gradient(to right, #d4c0b0, #b38b6d, #d4c0b0);
            margin: 0 auto 20px;
        }
        .host-text { font-family: 'Montserrat', sans-serif; font-size: 15px; line-height: 1.6; color: #5e4b3d; margin-bottom: 20px; }
        .host-contact {
            background: #fef5ed;
            border-radius: 60px;
            padding: 12px 20px;
            display: inline-block;
            min-width: 250px;
        }
        .host-label {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            font-style: italic;
            color: #b17a5c;
            margin-right: 15px;
        }
        .host-phone { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 600; color: #b38b6d; text-decoration: none; }
        .host-phone:hover { color: #9c7459; text-decoration: underline; }
        @media (max-width: 550px) {
            .host-card { padding: 25px 20px; margin: 20px 16px; border-radius: 36px; }
            .host-title { font-size: 20px; }
            .host-label { font-size: 18px; display: block; margin-bottom: 8px; margin-right: 0; }
            .host-contact { display: block; }
        }
